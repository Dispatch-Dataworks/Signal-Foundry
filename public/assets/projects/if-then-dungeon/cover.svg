    <text x="535" y="239" font-size="27" fill="#ddbd7d">THEN</text>
    <text x="535" y="559" font-size="27" fill="#c8a3dc">ELSE</text>
    <text x="365" y="397" font-size="22" fill="#372443">IF</text>
  </g>
  <g fill="none" stroke="#ddbd7d" stroke-width="3">
