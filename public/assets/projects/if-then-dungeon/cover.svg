    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#d8bff0" stroke-opacity=".06" />
    </pattern>
  </defs>
  <path fill="url(#bg)" d="M0 0h1200v800H0z" />
  <path fill="url(#grid)" d="M0 0h1200v800H0z" />
  <g fill="#34263f" stroke="#a78eba" stroke-opacity=".45" stroke-width="2">
    <rect x="160" y="325" width="130" height="130" rx="8" />
    <rect x="470" y="165" width="130" height="130" rx="8" />
    <rect x="470" y="485" width="130" height="130" rx="8" />
    <rect x="820" y="165" width="130" height="130" rx="8" />
    <rect x="820" y="485" width="130" height="130" rx="8" />
  </g>
  <g fill="none" stroke="#c8a3dc" stroke-width="4">
    <path d="M290 390h75V230h105M365 390v160h105M600 230h220M600 550h220" />
    <path d="m805 219 15 11-15 11m0 298 15 11-15 11" stroke-linejoin="round" />
