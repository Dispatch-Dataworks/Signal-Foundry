  height="800"
  viewBox="0 0 1200 800"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Far Haul — a route beyond the horizon</title>
  <desc id="desc">
    Original concept placeholder illustration of a distant planet, curved
    freight route, and abstract cargo silhouette. Not a game screenshot or final
    logo.
  </desc>
  <defs>
