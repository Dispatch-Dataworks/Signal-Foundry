      <stop stop-color="#789ba9" />
      <stop offset=".7" stop-color="#304957" />
      <stop offset="1" stop-color="#142230" />
    </radialGradient>
    <linearGradient id="route">
      <stop stop-color="#e7b985" stop-opacity=".1" />
      <stop offset=".6" stop-color="#e7b985" />
      <stop offset="1" stop-color="#e7b985" stop-opacity=".2" />
    </linearGradient>
  </defs>
  <path fill="url(#bg)" d="M0 0h1200v800H0z" />
  <g fill="#bcd3df">
