    <rect x="380" y="260" width="100" height="100" rx="13" />
    <rect x="500" y="260" width="100" height="100" rx="13" />
    <rect x="620" y="260" width="100" height="100" rx="13" />
    <rect x="740" y="260" width="100" height="100" rx="13" />
    <rect x="380" y="380" width="100" height="100" rx="13" />
    <rect x="620" y="380" width="100" height="100" rx="13" />
    <rect x="380" y="500" width="100" height="100" rx="13" />
    <rect x="620" y="500" width="100" height="100" rx="13" />
  </g>
  <rect x="500" y="380" width="100" height="100" rx="13" fill="#e2ae65" />
  <g
