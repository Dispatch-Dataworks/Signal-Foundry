<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="800"
  viewBox="0 0 1200 800"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">WordWeave — woven words</title>
  <desc id="desc">
    Original schematic placeholder illustration. Interlocking teal and amber
    letter tiles suggest a woven word puzzle. This is not a game screenshot or
    final logo.
  </desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#122b31" />
      <stop offset="1" stop-color="#071619" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#9dd8cc" stroke-opacity=".06" />
    </pattern>
    <linearGradient id="tile" x2="0" y2="1">
      <stop stop-color="#b2e4d3" />
      <stop offset="1" stop-color="#64b7a4" />
    </linearGradient>
  </defs>
  <path fill="url(#bg)" d="M0 0h1200v800H0z" />
  <path fill="url(#grid)" d="M0 0h1200v800H0z" />
  <circle
    cx="610"
    cy="395"
    r="270"
    fill="none"
    stroke="#b2e4d3"
    stroke-opacity=".12"
  />
  <circle
    cx="610"
    cy="395"
    r="310"
    fill="none"
    stroke="#b2e4d3"
    stroke-opacity=".06"
  />
  <g fill="none" stroke="#e2ae65" stroke-width="2" opacity=".55">
    <path d="M165 310H1035M165 430H1035M430 140V650M670 140V650" />
    <path d="M165 302v16m870-16v16M422 140h16m224 0h16M422 650h16m224 0h16" />
  </g>
  <g fill="url(#tile)" stroke="#d4eee4" stroke-opacity=".5">
