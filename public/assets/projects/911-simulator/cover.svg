<text x="68" y="214" fill="#fff" font-family="system-ui,sans-serif" font-size="92" font-weight="900" letter-spacing="-4">911 <tspan fill="#ff6757">SIMULATOR</tspan></text><text x="74" y="262" fill="#adc2ca" font-family="system-ui,sans-serif" font-size="27">Take the call. Read the scene. Make the decision.</text>
